version: '3.8'

services:
  # ============================================
  # PostgreSQL - Base de datos relacional
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: legalrag_postgres
    environment:
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag_secret
      POSTGRES_DB: legalrag_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalrag -d legalrag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legalrag_network

  # ============================================
  # Qdrant - Base de datos vectorial
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legalrag_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legalrag_network

  # ============================================
  # Redis - Cache y colas (opcional pero recomendado)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: legalrag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legalrag_network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  legalrag_network:
    driver: bridge
