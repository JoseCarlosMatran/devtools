version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: legalrag-postgres
    environment:
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag_secret
      POSTGRES_DB: legalrag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalrag"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Base de datos vectorial Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legalrag-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
